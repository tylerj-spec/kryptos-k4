name: R40 independent Gromark audit

on:
  pull_request:
    paths:
      - '.github/workflows/r40-verify.yml'
      - 'r40/**'

permissions:
  contents: read

jobs:
  validate-r40:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile independent key-symmetry/null scorer
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra r40/null_gate.cpp -o /tmp/r40-null
      - name: Replay 1000 unconditional K4 ciphertext-histogram null scans
        run: |
          /tmp/r40-null k4kit/r32/runs/k4_ciphertext.txt 1000 40001 > r40/NULL_1000_replay.tsv 2> r40/NULL_1000_replay.log
          cat r40/NULL_1000_replay.log
          test "$(wc -l < r40/NULL_1000_replay.tsv)" -eq 1002
          grep -q 'n_ge=716' r40/NULL_1000_replay.log
          sha256sum r40/NULL_1000_replay.tsv
      - name: Replay original R39 freeze and independent postfreeze key consistency check
        run: |
          python3 -I r40/postfreeze_oracle.py
          python3 - <<'PY'
          import json
          r=json.load(open('r40/POSTFREEZE_ORACLE_RESULT.json'))
          assert r['feasible_primers']==39
          assert r['n_feasible_top1000']==0 and r['n_feasible_top5000']==1
          assert r['ranked_feasible'][0]['primer']=='98800'
          print('R40 exact oracle cross-check:',r['ranked_feasible'][0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r40-independent-replay
          path: |
            r40/NULL_1000_replay.tsv
            r40/NULL_1000_replay.log
            r40/POSTFREEZE_ORACLE_RESULT.json
          retention-days: 30
