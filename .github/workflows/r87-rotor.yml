name: R87 stepping rotor (tests, witnesses, gate, evaluation and exact check re-derived)
on:
  pull_request:
    paths:
      - "r87/**"
      - ".github/workflows/r87-rotor.yml"
permissions:
  contents: read
jobs:
  r87-rederive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install numpy
      - name: "Unit tests (witness, kernel, three exact-check implementations, sandbox refusals, holdout maker, gate bars)"
        run: python3 -I r87/tests/test_r87.py
      - name: "Independent witnesses re-run on the frozen gate and K4 outputs"
        run: |
          python3 -I r87/sealed/witness87.py r87/holdout/BLIND.tsv r87/holdout/run/RESULTS.jsonl /tmp/wg.json
          python3 -I r87/sealed/witness87.py r87/k4/TARGET.tsv r87/k4/run/RESULTS.jsonl /tmp/wk.json
          cmp /tmp/wg.json r87/holdout/run/WITNESS.json
          cmp /tmp/wk.json r87/k4/run/WITNESS.json
      - name: "Gate verdict, K4 evaluation and post-freeze exact check re-derived and compared byte for byte"
        run: |
          python3 -I r87/sealed/gate87.py r87/holdout r87/holdout/TRUTH.json /tmp/GATE.json
          cmp /tmp/GATE.json r87/holdout/GATE.json
          python3 -I r87/sealed/evaluate87.py r87/k4/TARGET.tsv r87/k4/run/RESULTS.jsonl r87/k4/run/WITNESS.json r87/k4/FROZEN.sha256 /tmp/EVALUATION.json
          cmp /tmp/EVALUATION.json r87/k4/EVALUATION.json
          python3 -I r87/sealed/exact87.py r87/k4/TARGET.tsv /tmp/EXACT.json
          cmp /tmp/EXACT.json r87/k4/EXACT.json
