name: R89 frozen evidence and independent mathematical review
on:
  pull_request:
    paths:
      - "r89/**"
      - ".github/workflows/r89-f26l-rct.yml"
permissions:
  contents: read
jobs:
  r89-rederive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install numpy
      - name: "Bounded original unit, witness, gate, evaluation and exact replays"
        run: >-
          python3 -I audit/run_bounded.py --manifest r89/QA_MANIFEST.json
          --log /tmp/r89-replay-resource.json -- python3 -I r89/audit/review_replay.py
          --root . --out /tmp/r89-replay
      - name: "Bounded independent exact reconstruction and exhaustive toy oracle"
        run: |
          python3 -I audit/run_bounded.py --manifest r89/QA_MANIFEST.json --log /tmp/r89-independent-resource.json -- python3 -I r89/audit/independent_exact.py . /tmp/r89-independent-exact.json
          cmp /tmp/r89-independent-exact.json r89/audit/evidence/INDEPENDENT_EXACT.json
      - name: "Independent synthetic gate and key-recovery audit"
        run: |
          python3 -I r89/audit/recompute_gate.py . /tmp/r89-independent-gate.json
          cmp /tmp/r89-independent-gate.json r89/audit/evidence/GATE_RECOMPUTED.json
      - name: "Retain audit logs and results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r89-review-evidence
          path: |
            /tmp/r89-replay
            /tmp/r89-replay-resource.json
            /tmp/r89-independent-resource.json
            /tmp/r89-independent-exact.json
            /tmp/r89-independent-gate.json
