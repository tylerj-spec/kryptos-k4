name: R62 source overlap audit Carter Mace 1923 versus Kryptos K3
on:
  push:
    branches: ["chatgpt/r62-audit-checks-backup"]
    paths:
      - ".github/workflows/r62-k3-overlap.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independently-recompute-k3-training-source-overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Confirm original Carter 1923 is in R59 training corpus and no known K4 clue file read
        shell: bash
        run: |
          set -euo pipefail
          test ! -f r62/audit/frozen/K3_LEAKAGE.json
          grep -q 'Carter_Mace_1923' r59/corpus/build_corpus.py
          python3 -I r62/audit/measure_k3_overlap.py \
            k4kit/data/k1k3_plaintext.txt r34/carter_az.txt \
            "$RUNNER_TEMP/R62_K3_LEAKAGE.json"
          python3 - "$RUNNER_TEMP/R62_K3_LEAKAGE.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["K3_positions_in_criterion"]==291
          assert p["K3_unduplicated_letters"]==336
          assert p["longest_exact_Carter_training_match"]["length"]==64
          print("K3 exact Carter 1923 >=12-letter overlap 291/336 positions confirmed")
          PY
      - name: Commit negative-space source leakage with original independent SHA-256 into draft PR
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/R62_K3_LEAKAGE.json" r62/audit/frozen/K3_LEAKAGE.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add r62/audit/frozen/K3_LEAKAGE.json
          git commit -m "R62 independently freeze source-hashed K3 Carter/Mace training overlap 291/336 [skip ci]"
          git push origin HEAD:refs/heads/chatgpt/r62-audit-checks-backup
