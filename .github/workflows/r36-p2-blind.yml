name: R36 P2 nondecimal Gromark strict-blind experiment

on:
  push:
    branches:
      - 'chatgpt/r36-nondecimal-chain-gromark'

permissions:
  contents: write

concurrency:
  group: r36-p2
  cancel-in-progress: false

jobs:
  run-p2:
    if: "startsWith(github.event.head_commit.message, 'R36 P2: RUN BLIND')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/r36-nondecimal-chain-gromark
          fetch-depth: 0
          persist-credentials: true
      - name: Commit attribution
        run: |
          git config user.name "R36 Research Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Standard regressions and historical audits
        run: |
          bash strictblind/tests/run_all.sh
          bash verify_all.sh
      - name: Protocol lock, blind scan, commit freeze, independent reveal
        run: bash r36/run_p2.sh
      - name: Preserve outputs if GitHub push is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36-p2-run
          path: r36/p2_direct_multibase/
          if-no-files-found: warn
