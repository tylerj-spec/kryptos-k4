name: K4 research evidence guardrails

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - audit/ledger-evidence-integrity

permissions:
  contents: read

jobs:
  future-experiment-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Adversarial synthetic repo fixtures
        run: python3 -I audit/tests/test_guardrails.py
      - name: Prevent frozen-result rewrites and unaudited ledger claims
        run: python3 -I audit/check_guardrails.py --base origin/main --head HEAD
      - name: Existing strict blindness baseline
        run: python3 -I r53/tests/test_contract.py
