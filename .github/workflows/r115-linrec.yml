name: R115 linear-recurrence check (hash checks and full deterministic re-run)
on:
  pull_request:
    paths:
      - "r115/**"
      - ".github/workflows/r115-linrec.yml"
permissions:
  contents: read
jobs:
  r115-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install "numpy>=1.26,<3"
      - name: "Registration, source and output manifests"
        run: |
          sha256sum -c r115/PROTOCOL.sha256
          sha256sum -c r115/SOURCE.sha256
          sha256sum -c r115/run_v2/OUTPUTS.sha256
      - name: "Re-run the registered computation and compare every result except timings"
        run: |
          python3 -I r115/run115.py /tmp/R115.json
          python3 - <<'PY'
          import json
          a, b = json.load(open("/tmp/R115.json")), json.load(open("r115/run_v2/RESULTS.json"))
          for d in (a, b):
              d.pop("wall_s"); d.pop("cpu_s"); d.pop("stage_wall_s")
          assert a == b, [k for k in a if a[k] != b.get(k)]
          print("R115 reproduced; labels", b["labels"], "T1-T3 pass", b["T1_T3_pass"])
          PY
