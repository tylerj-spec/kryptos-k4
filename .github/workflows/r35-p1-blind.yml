name: R35 P1 Carter K3-shaped mixed rotations

on:
  push:
    branches:
      - 'chatgpt/r35-blind-integrity-and-mixed-rotations'

permissions:
  contents: write

concurrency:
  group: r35-p1
  cancel-in-progress: false

jobs:
  run-p1:
    if: "startsWith(github.event.head_commit.message, 'R35 P1: RUN BLIND')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/r35-blind-integrity-and-mixed-rotations
          fetch-depth: 0
          persist-credentials: true
      - name: Commit attribution
        run: |
          git config user.name "R35 Research Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Standard regressions and previous audits
        run: |
          bash strictblind/tests/run_all.sh
          bash verify_all.sh
      - name: Protocol lock then blind scan/freeze then reveal
        run: bash r35/run_p1.sh
      - name: Preserve outputs if git commit or push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r35-p1-run
          path: r35/p1_carter_k3_mixed/
          if-no-files-found: warn
