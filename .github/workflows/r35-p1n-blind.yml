name: R35 P1N posthoc null calibration

on:
  push:
    branches:
      - 'chatgpt/r35-blind-integrity-and-mixed-rotations'

permissions:
  contents: write

concurrency:
  group: r35-p1n
  cancel-in-progress: false

jobs:
  run-nulls:
    if: "startsWith(github.event.head_commit.message, 'R35 P1N: RUN NULLS')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/r35-blind-integrity-and-mixed-rotations
          fetch-depth: 0
      - name: Commit attribution
        run: |
          git config user.name "R35 Research Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Regressions and historical checks
        run: |
          bash strictblind/tests/run_all.sh
          bash verify_all.sh
      - name: Lock protocol, freeze 12 blind nulls, then posthoc assessment
        run: bash r35/run_p1n.sh
      - name: Preserve outputs if push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r35-p1n-nulls
          path: r35/p1_null_calibration/
          if-no-files-found: warn
