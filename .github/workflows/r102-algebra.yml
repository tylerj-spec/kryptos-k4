name: R102 S3b algebra (frozen-output check and deterministic re-run)
on:
  pull_request:
    paths:
      - "r102/**"
      - ".github/workflows/r102-algebra.yml"
permissions:
  contents: read
jobs:
  r102-rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install "numpy>=1.26,<3"
      - name: "Registration, source and output manifests"
        run: |
          sha256sum -c r102/PROTOCOL.sha256
          sha256sum -c r102/SOURCE.sha256
          sha256sum -c r102/run_v2/OUTPUTS.sha256
      - name: "Re-run the registered v2 computation and compare every result except timings"
        run: |
          python3 -I r102/run102.py /tmp/R102.json
          python3 - <<'PY'
          import json
          a = json.load(open("/tmp/R102.json")); b = json.load(open("r102/run_v2/RESULTS.json"))
          for d in (a, b):
              d.pop("wall_s"); d.pop("cpu_s")
          assert a == b, [k for k in a if a[k] != b.get(k)]
          print("R102 v2 reproduced:", a["verdict"])
          PY
